name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  common:
    name: Common Module Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/**/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run common module tests
        run: ./mvnw -pl common -am clean test

  deck-service:
    name: Deck Service Build and Test
    runs-on: ubuntu-latest

    # Runs from services/ so the parent pom.xml and shared modules are part of the build.
    defaults:
      run:
        working-directory: services

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/**/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # -pl = test this module; -am = also build the modules it depends on
      - name: Run deck service tests
        run: ./mvnw -pl deck-service -am clean test

  user-service:
    name: User Service Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/**/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run user service tests
        run: ./mvnw -pl user-service -am clean test

  deploy:
    name: Deploy to Railway
    needs: deck-service
    runs-on: ubuntu-latest
    # Deploy paused during the multi-service restructure. To re-enable,
    # restore: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
