spring.application.name=flashcards

spring.datasource.url=jdbc:postgresql://localhost:5432/flashcards
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Suppress WARN for missing static resources (e.g. favicon.ico). Spring's static
# resource handler logs a WARN for every 404 it handles, which produces noise on
# every page load since browsers always request /favicon.ico automatically.
logging.level.org.springframework.web.servlet.resource=ERROR
