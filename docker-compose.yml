services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards   # local development only
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps data between restarts
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # schemas and logins, first run only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards -d flashcards"]
      interval: 5s
      retries: 10

  deck-service:
    build:
      context: ./services          # the whole services/ folder, so shared modules are visible
      dockerfile: deck-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashcards?currentSchema=content
      SPRING_DATASOURCE_USERNAME: content_svc
      SPRING_DATASOURCE_PASSWORD: content_svc
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections

  user-service:
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashcards?currentSchema=users
      SPRING_DATASOURCE_USERNAME: user_svc
      SPRING_DATASOURCE_PASSWORD: user_svc
      JWT_SECRET: local-dev-only-jwt-secret-change-in-production   # 46 bytes; local only
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:1.27
    ports:
      - "8080:80"   # the only port exposed to your machine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - deck-service
      - user-service

volumes:
  pgdata:
