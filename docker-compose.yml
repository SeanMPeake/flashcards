services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards   # local development only
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards -d flashcards"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashcards
      SPRING_DATASOURCE_USERNAME: flashcards
      SPRING_DATASOURCE_PASSWORD: flashcards
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections

  gateway:
    image: nginx:1.27
    ports:
      - "8080:80"   # the only port exposed to your machine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
