server {
    listen 80;

    # Serve the frontend's static files (index.html, styles.css, js/)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Forward user/account requests to the user service
    location /api/users/ {
        proxy_pass http://user-service:8080;
    }

    # Forward all other API requests to the deck service by its Compose name
    location /api/ {
        proxy_pass http://deck-service:8080;
    }
}
