spring.application.name=deck-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# All of this service's tables live in its own schema (created by db/init.sql)
spring.jpa.properties.hibernate.default_schema=content

# All timestamps are UTC (Instant fields stored as timestamptz), whatever the server's
# own timezone, so they line up with the UTC timestamps services exchange in events.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secret for verifying login tokens; must be the same value the user service signs
# with. Read from the JWT_SECRET environment variable in every profile.
jwt.secret=${JWT_SECRET}
