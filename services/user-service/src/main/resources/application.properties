spring.application.name=user-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# All of this service's tables live in its own schema (created by db/init.sql)
spring.jpa.properties.hibernate.default_schema=users

# All timestamps are UTC (Instant fields stored as timestamptz), whatever the server's
# own timezone, so they line up with the UTC timestamps services exchange in events.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Login tokens are valid for 24 hours (no refresh tokens in this project)
jwt.expiration-hours=24

# Signing secret for login tokens; must be at least 32 bytes. Read from the
# JWT_SECRET environment variable in every profile.
jwt.secret=${JWT_SECRET}
